[package]
name = "tearoom"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"

toml = "0.8"
libc = "0.2"
unicode-general-category = "0.6"
tiny_http = "0.12"
ureq = { version = "2", features = ["json"] }
url = "2"
