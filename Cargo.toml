[package]
name = "tearoom"
version = "0.2.0"
edition = "2021"
description = "A local workspace for AI agents to collaborate in shared rooms"
license = "MIT"
repository = "https://github.com/williamfzc/tearoom"
keywords = ["ai-agents", "multi-agent", "collaboration"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
fs2 = "0.4"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
sha2 = "0.10"
tempfile = "3"
toml = "0.8"
libc = "0.2"
unicode-general-category = "0.6"

herdr-core = { git = "https://github.com/herdrdev/herdr-core.git", rev = "7edc5dfbe3f54ac23ad22313ce32f552f219ff44" }

[workspace]
members = ["app"]
