# Tag-driven Rust publication; each binary is built and tested on its native host.
name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: read

concurrency:
  group: tearoom-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
      - run: make check

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            triple: x86_64-apple-darwin
          - target: darwin-arm64
            runner: macos-15
            triple: aarch64-apple-darwin
          - target: linux-amd64
            runner: ubuntu-24.04
            triple: x86_64-unknown-linux-musl
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.triple }}
      - name: Install musl compiler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build target twice and compare
        env:
          RELEASE_TARGET: ${{ matrix.target }}
        run: |
          make release-target RELEASE_TAG="$GITHUB_REF_NAME" RELEASE_COMMIT="$GITHUB_SHA" RELEASE_DIR=dist/one RELEASE_TARGET="$RELEASE_TARGET"
          make release-target RELEASE_TAG="$GITHUB_REF_NAME" RELEASE_COMMIT="$GITHUB_SHA" RELEASE_DIR=dist/two RELEASE_TARGET="$RELEASE_TARGET"
          cmp "dist/one/tearoom_${GITHUB_REF_NAME}_${RELEASE_TARGET%-*}_${RELEASE_TARGET#*-}.tar.gz" "dist/two/tearoom_${GITHUB_REF_NAME}_${RELEASE_TARGET%-*}_${RELEASE_TARGET#*-}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/one/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - name: Assemble and verify artifacts
        run: make package RELEASE_TAG="$GITHUB_REF_NAME" RELEASE_COMMIT="$GITHUB_SHA" RELEASE_DIR=dist/release
      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          verify_tag() {
            tag_ref="refs/tags/$GITHUB_REF_NAME"
            refs=$(git ls-remote origin "$tag_ref" "$tag_ref^{}")
            commit=$(printf '%s\n' "$refs" | awk -v ref="$tag_ref" '$2 == ref {raw = $1} $2 == ref "^{}" {peeled = $1} END {print peeled ? peeled : raw}')
            if [ "$commit" != "$GITHUB_SHA" ]; then
              echo "release: remote tag no longer points to the verified commit" >&2
              exit 1
            fi
          }
          # A pre-existing release is never overwritten, including a draft.
          verify_tag
          prerelease=""
          case "${GITHUB_REF_NAME%%+*}" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --verify-tag --draft --title "$GITHUB_REF_NAME" --notes "" $prerelease
          gh release upload "$GITHUB_REF_NAME" dist/release/*
          verify_dir="$RUNNER_TEMP/tearoom-release-readback"
          mkdir -p "$verify_dir"
          gh release download "$GITHUB_REF_NAME" --dir "$verify_dir"
          for file in dist/release/*; do cmp "$file" "$verify_dir/${file##*/}"; done
          make release-check RELEASE_TAG="$GITHUB_REF_NAME" RELEASE_COMMIT="$GITHUB_SHA" RELEASE_DIR="$verify_dir"
          tar -xzf "$verify_dir/tearoom_${GITHUB_REF_NAME}_linux_amd64.tar.gz" -C "$verify_dir"
          test "$("$verify_dir/tearoom" --version)" = "tearoom version=$GITHUB_REF_NAME commit=$GITHUB_SHA store-format=4"
          verify_tag
          gh release edit "$GITHUB_REF_NAME" --draft=false
