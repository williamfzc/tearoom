# Render blueprint for the hosted profile: one web service from the
# Dockerfile, one owner token generated by the platform. Paste the Neon DSN
# into TEAROOM_DSN on first deploy (docs/operations/serving.md).
services:
  - type: web
    name: tearoom
    env: docker
    plan: free
    envVars:
      - key: TEAROOM_DSN
        sync: false
      - key: TEAROOM_OWNER_TOKEN
        generateValue: true
