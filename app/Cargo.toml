[package]
name = "tearoom-app"
version = "0.2.0"
edition = "2021"
description = "Local desktop face for Tearoom rooms"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
base64 = "0.22"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tearoom = { path = ".." }

[dev-dependencies]
tempfile = "3"
