<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tearoom</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36;
    --fg: #e6e9ef; --muted: #8b93a4;
    --urgent: #ff6b5d; --warn: #f0a83c; --ok: #3ecf8e; --accent: #6b8afd;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px; background: var(--bg); color: var(--fg);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  #app { max-width: 1000px; margin: 0 auto; }
  .hdr { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  .hdr h1 { margin: 0; font-size: 20px; font-weight: 650; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: 10px; padding: 16px; margin-bottom: 14px;
  }
  .card h2 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase;
             letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  /* Attention is the only section allowed to shout. */
  .card.urgent { border-color: rgba(255,107,93,.45); background: linear-gradient(180deg,rgba(255,107,93,.07),transparent 60%), var(--card); }
  .card.urgent h2 { color: var(--urgent); }
  .card.calm { border-color: rgba(62,207,142,.3); }
  .card.calm h2 { color: var(--ok); }
  .card.bad h2 { color: var(--urgent); }
  .muted { color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; padding: 7px 0;
         border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .att { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0;
         border-top: 1px solid var(--line); }
  .att:first-of-type { border-top: 0; }
  .att-body { flex: 1; }
  .att-label { font-weight: 600; margin-bottom: 2px; }
  .tag { font: 11px var(--mono); padding: 2px 7px; border-radius: 5px;
         background: #222836; color: var(--muted); white-space: nowrap; }
  .tag.bad { background: rgba(255,107,93,.16); color: var(--urgent); }
  .tag.warn { background: rgba(240,168,60,.16); color: var(--warn); }
  .att-needs-approval .tag { background: rgba(240,168,60,.18); color: var(--warn); }
  .att-deadlock .tag, .att-stalled .tag { background: rgba(255,107,93,.18); color: var(--urgent); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
  .dot.stale { background: var(--urgent); }
  .name { font-weight: 600; min-width: 90px; }
  .tid { font: 12px var(--mono); color: var(--accent); min-width: 34px; }
  .title { flex: 1; }
  .status { font: 11px var(--mono); padding: 2px 7px; border-radius: 5px;
            background: #222836; min-width: 66px; text-align: center; }
  .status-blocked { background: rgba(255,107,93,.16); color: var(--urgent); }
  .status-claimed { background: rgba(107,138,253,.16); color: var(--accent); }
  .status-resolved { background: rgba(62,207,142,.14); color: var(--ok); }
  .actions { display: flex; gap: 6px; }
  .btn { font: 12px inherit; padding: 5px 12px; border-radius: 6px; cursor: pointer;
         border: 1px solid var(--line); background: #202634; color: var(--fg); }
  .btn:hover { border-color: var(--muted); }
  .btn.ok:hover { border-color: var(--ok); color: var(--ok); }
  .btn.no:hover { border-color: var(--urgent); color: var(--urgent); }
  .boot { color: var(--muted); }
</style>
</head>
<body>
  <div id="app"><p class="boot">Loading…</p></div>
  <script src="wasm_exec.js"></script>
  <script>
    // The console is a Go binary. There is no application JavaScript here on
    // purpose: the moment view logic lives in JS it starts drifting from the CLI.
    const go = new Go();
    WebAssembly.instantiateStreaming(fetch("tea.wasm"), go.importObject)
      .then(r => go.run(r.instance))
      .catch(e => {
        document.getElementById("app").innerHTML =
          '<section class="card bad"><h2>Console failed to start</h2>' +
          '<p class="muted">' + e + '</p></section>';
      });
  </script>
</body>
</html>
